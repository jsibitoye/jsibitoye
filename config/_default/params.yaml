# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/

appearance:
  mode: system
  color: blue

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'iTechSVC'
    description: 'Joshua Seyi Ibitoye is a cloud security, DevSecOps, and AI systems engineer building secure infrastructure, intelligent automation, and applied cybersecurity research.'
    twitter: 'jsibitoye'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Josh Ibitoye'

footer:
  copyright:
    notice: 'Copyright {year} Joshua Seyi Ibitoye. All rights reserved.'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

features:
  math:
    enable: false
  privacy_pack:
    enable: false
